<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#07080f}canvas{display:block}</style>
</head><body>
<canvas id="grid" width="1200" height="1800"></canvas>
<script>
const CYAN="#4de3ff", VIOLET="#7c5cff", PINK="#ff4d7d", BG="#07080f", TX="#f4f6ff";
const c=document.getElementById("grid"),ctx=c.getContext("2d");
ctx.fillStyle="#0b0d17";ctx.fillRect(0,0,1200,1800);

function tile(ix,iy,nombre,draw){
  const x=ix*600, y=iy*600;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=BG;
  // tarjeta
  ctx.beginPath();ctx.roundRect(30,30,540,470,28);ctx.fill();
  ctx.strokeStyle="rgba(124,92,255,0.25)";ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(300,240);draw(ctx);ctx.restore();
  ctx.font="700 26px 'Space Grotesk', Inter, sans-serif";
  ctx.fillStyle="rgba(244,246,255,0.85)";
  const w=ctx.measureText(nombre).width;
  ctx.fillText(nombre,300-w/2,545);
  ctx.restore();
}
function grad(ctx,x0,y0,x1,y1,a=CYAN,b=VIOLET){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}

// A — LA CINTA: V hecha de una cinta de película que se dobla
function A(ctx){
  ctx.lineJoin="round";
  const g=grad(ctx,-80,-80,80,80);
  // cinta: dos bandas anchas que bajan en V, con perforaciones
  ctx.fillStyle=TX;
  ctx.beginPath();ctx.moveTo(-90,-80);ctx.lineTo(-40,-80);ctx.lineTo(20,60);ctx.lineTo(0,105);ctx.closePath();ctx.fill();
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(40,-80);ctx.lineTo(90,-80);ctx.lineTo(0,105);ctx.lineTo(-8,85);ctx.closePath();ctx.fill();
  // perforaciones de cine sobre la banda blanca
  ctx.fillStyle=BG;
  for(let i=0;i<5;i++){const t=i/4;const px=-78+t*68, py=-70+t*140;ctx.beginPath();ctx.roundRect(px,py,14,10,3);ctx.fill();}
}

// B — EL IRIS: la V dentro de un obturador/lente (mirar es el producto)
function B(ctx){
  const g=grad(ctx,-90,-90,90,90);
  ctx.strokeStyle=g;ctx.lineWidth=10;
  ctx.beginPath();ctx.arc(0,0,95,0,7);ctx.stroke();
  // hojas de obturador
  ctx.strokeStyle="rgba(244,246,255,0.25)";ctx.lineWidth=4;
  for(let i=0;i<6;i++){const a=i*Math.PI/3;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*92,Math.sin(a)*92);
    ctx.lineTo(Math.cos(a+0.9)*40,Math.sin(a+0.9)*40);ctx.stroke();}
  // V sólida al centro
  ctx.fillStyle=TX;
  ctx.beginPath();ctx.moveTo(-42,-38);ctx.lineTo(-16,-38);ctx.lineTo(0,14);ctx.lineTo(16,-38);ctx.lineTo(42,-38);ctx.lineTo(8,52);ctx.lineTo(-8,52);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(28,-52,7,0,7);ctx.fillStyle=PINK;ctx.fill();
}

// C — WORDMARK PLAY: el logotipo es la palabra; la segunda V es un play ▶
function C(ctx){
  ctx.font="700 92px 'Space Grotesk', Inter, sans-serif";
  const t1="VYNA", t2="O";
  const w1=ctx.measureText(t1).width;
  const playW=64, w2=ctx.measureText(t2).width;
  const x0=-(w1+playW+w2)/2;
  ctx.fillStyle=TX; ctx.fillText(t1,x0,32);
  // play ▶ en lugar de la segunda V
  const px=x0+w1+8;
  const g=grad(ctx,px,-40,px+52,40);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(px,-58);ctx.lineTo(px+52,-13);ctx.lineTo(px,32);ctx.closePath();ctx.fill();
  ctx.fillStyle=TX; ctx.fillText(t2,px+playW-4,32);
  // subrayado hairline
  ctx.fillStyle=grad(ctx,x0,0,x0+w1+playW+w2,0);
  ctx.fillRect(x0,58,w1+playW+w2,4);
}

// D — LA CLAQUETA: V como claqueta abierta (cine puro)
function D(ctx){
  const g=grad(ctx,-80,-90,60,0);
  // brazo superior (abierto, rotado)
  ctx.save();ctx.translate(-70,-30);ctx.rotate(-0.38);
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,-26,170,34,8);ctx.fill();
  ctx.fillStyle=BG;
  for(let i=0;i<4;i++){ctx.save();ctx.translate(18+i*42,-26);ctx.rotate(0.55);ctx.fillRect(0,0,16,34);ctx.restore();}
  ctx.restore();
  // cuerpo
  ctx.fillStyle=TX;
  ctx.beginPath();ctx.roundRect(-70,-6,150,110,12);ctx.fill();
  // V recortada en el cuerpo
  ctx.fillStyle=BG;
  ctx.beginPath();ctx.moveTo(-38,14);ctx.lineTo(-16,14);ctx.lineTo(5,72);ctx.lineTo(26,14);ctx.lineTo(48,14);ctx.lineTo(16,90);ctx.lineTo(-6,90);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(58,10,6,0,7);ctx.fillStyle=PINK;ctx.fill();
}

// E — DOS MÁSCARAS: drama clásico vuelto moderno — V partida en dos emociones
function E(ctx){
  // mitad izquierda: cián (comedia/luz), mitad derecha: rosa (drama/sombra)
  const mask=(flip,color)=>{
    ctx.save();ctx.scale(flip,1);
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(6,-80);ctx.lineTo(66,-80);
    ctx.quadraticCurveTo(78,10,30,86);
    ctx.quadraticCurveTo(12,104,6,86);ctx.closePath();ctx.fill();
    // ojo
    ctx.fillStyle=BG;
    ctx.beginPath();ctx.ellipse(38,-38,13,8,flip*0.3,0,7);ctx.fill();
    // boca media (sonrisa vs pena)
    ctx.strokeStyle=BG;ctx.lineWidth=6;ctx.lineCap="round";
    ctx.beginPath();
    if(flip>0){ctx.arc(36,28,16,0.3,2.5);}else{ctx.arc(36,44,16,-2.6,-0.6);}
    ctx.stroke();
    ctx.restore();
  };
  mask(-1,grad(ctx,-80,-80,0,80,CYAN,VIOLET));
  mask(1,grad(ctx,0,-80,80,80,VIOLET,PINK));
}

// F — LA BURBUJA: historia + play (los microdramas son historias que se cuentan)
function F(ctx){
  const g=grad(ctx,-80,-80,80,80);
  // burbuja de diálogo redondeada
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(-85,-75,170,130,42);ctx.fill();
  ctx.beginPath();ctx.moveTo(-30,52);ctx.lineTo(-14,96);ctx.lineTo(14,54);ctx.closePath();ctx.fill();
  // play blanco dentro
  ctx.fillStyle=BG;
  ctx.beginPath();ctx.roundRect(-71,-61,142,102,32);ctx.fill();
  ctx.fillStyle=TX;
  ctx.beginPath();ctx.moveTo(-22,-36);ctx.lineTo(34,-10);ctx.lineTo(-22,16);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(44,-44,7,0,7);ctx.fillStyle=PINK;ctx.fill();
}

document.fonts.ready.then(()=>{
  tile(0,0,"A · La Cinta",A);
  tile(1,0,"B · El Iris",B);
  tile(0,1,"C · Wordmark Play",C);
  tile(1,1,"D · La Claqueta",D);
  tile(0,2,"E · Dos Máscaras",E);
  tile(1,2,"F · La Burbuja",F);
  window.__ready=true;
});
</script></body></html>
