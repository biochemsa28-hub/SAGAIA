<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- VYNAVO — versión futurista IA: V-play en neón (cian→violeta→rosa),
       nodos de circuito y núcleo. Fondo #05060d. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e0ff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff3d8e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#05060d"/>
  <g transform="translate(100,100)" filter="url(#glow)">
    <g stroke="#22e0ff" stroke-opacity=".5" stroke-width="2">
      <line x1="-45" y1="-38" x2="-78" y2="-44"/><line x1="-30" y1="4" x2="-84" y2="10"/>
      <line x1="42" y1="-16" x2="80" y2="-10"/><line x1="20" y1="36" x2="74" y2="44"/>
      <line x1="10" y1="-60" x2="6" y2="-86"/>
    </g>
    <circle cx="-78" cy="-44" r="4" fill="#22e0ff"/><circle cx="-84" cy="10" r="4" fill="#ff3d8e"/>
    <circle cx="80" cy="-10" r="4" fill="#22e0ff"/><circle cx="74" cy="44" r="4" fill="#ff3d8e"/>
    <circle cx="6" cy="-86" r="4" fill="#22e0ff"/>
    <path d="M -62 -60 L -28 -60 L 4 28 L -14 62 Z" fill="rgba(34,224,255,0.10)"
          stroke="#22e0ff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 28 -60 L 66 -60 L -14 62 Z" fill="url(#g)"/>
    <circle cx="52" cy="-34" r="11" fill="none" stroke="#eef2ff" stroke-width="2.5"/>
    <circle cx="52" cy="-34" r="4.5" fill="#22e0ff"/>
  </g>
</svg>
